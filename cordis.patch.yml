# dsh-retro bundle patch：挂载复盘插件。默认 enabled:false，装上不动作（零事件监听、零工具）。
# 开启方式（在 profile patch 层或 ~/.dsh/cordis.patch.yml）：
#   - id: dsh-retro
#     config:
#       enabled: true
#       remind: true        # 同时把 retro_review 收尾提醒注入 system prompt
- insert:
    - id: dsh-retro
      name: dsh-retro
      config:
        enabled: false
        storageDir: ''
        minToolsForTurnTrace: 1
        minToolsForRetro: 2
        minTurnsForRetro: 3
        remind: false
        pushToViking: true
        inbox: true
        inboxIntervalMs: 60000
